services:
  - type: web
    name: wnba-player-similarity-backend
    env: node
    buildCommand: npm install
    startCommand: node API/server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/test

  - type: web
    name: wnba-player-similarity-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: node server-frontend.js
    envVars:
      - key: REACT_APP_API_URL
        sync: false
        value: https://wnba-player-similarity-backend.onrender.com/api
      - key: NODE_ENV
        value: production

