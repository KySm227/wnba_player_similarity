services:
  - type: web
    name: wnbaedge
    env: node
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/test

  - type: web
    name: wnbaedge
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run frontend
    envVars:
      - key: REACT_APP_API_URL
        sync: false
        value: https://wnbaedge.onrender.com
      - key: NODE_ENV
        value: production
